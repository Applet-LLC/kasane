name = "kasane-license"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

# 商品 ID と署名鍵は secret に入れる(README の手順)。ここには書かない。
[vars]
MAX_ACTIVATIONS = "100"
TRIAL_MAX_ACTIVATIONS = "5"
TOKEN_EXPIRY_DAYS = "7"
TRIAL_DAYS = "6"

# 1 つの IP あたり、60 秒に 20 回まで。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
